<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ticketdesk</title>
<style>
:root{
  --bg:#fbf7fa; --rail:#f5f0f5; --panel:#ffffff; --ink:#2b2a38; --muted:#77738a; --line:#ebe3ec; --hover:#f1e9f1; --sel:#fbe6ef;
  --pink:#de6d97; --pink-soft:#fbe6ef; --pink-ink:#b23f6b;
  --blue:#4a88d2; --blue-soft:#e6effb; --blue-ink:#2b66ad;
  --lav:#9884d8; --lav-soft:#eeeafb; --lav-ink:#6955b4;
  --amber:#d9982f; --amber-soft:#fcefd6; --amber-ink:#8f5a08;
  --red:#d9443a; --red-soft:#fde3e1; --red-ink:#a3271f;
  --shadow:0 1px 2px rgba(60,30,70,.05),0 4px 14px rgba(60,30,70,.06);
  --rail-w:380px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1b1a22; --rail:#201e29; --panel:#25232e; --ink:#e7e4ef; --muted:#9a95ac; --line:#37334a; --hover:#2e2a3a; --sel:#42263a;
  --pink:#e57fa6; --pink-soft:#42263a; --pink-ink:#f3a6c4;
  --blue:#6aa3e6; --blue-soft:#1f3048; --blue-ink:#9cc4f2;
  --lav:#a996e6; --lav-soft:#2d2746; --lav-ink:#c8baf5;
  --amber:#e0a84a; --amber-soft:#3d301a; --amber-ink:#f0c983;
  --red:#e8675e; --red-soft:#43221f; --red-ink:#f4a59f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#1b1a22; --rail:#201e29; --panel:#25232e; --ink:#e7e4ef; --muted:#9a95ac; --line:#37334a; --hover:#2e2a3a; --sel:#42263a;
  --pink:#e57fa6; --pink-soft:#42263a; --pink-ink:#f3a6c4;
  --blue:#6aa3e6; --blue-soft:#1f3048; --blue-ink:#9cc4f2;
  --lav:#a996e6; --lav-soft:#2d2746; --lav-ink:#c8baf5;
  --amber:#e0a84a; --amber-soft:#3d301a; --amber-ink:#f0c983;
  --red:#e8675e; --red-soft:#43221f; --red-ink:#f4a59f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-ink)}
code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:100vh}
/* rail */
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--rail);border-right:1px solid var(--line);min-width:0}
.rhead{padding:12px 12px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.rrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;letter-spacing:.3px;cursor:pointer;flex:1}
h1 span{color:var(--pink)}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:1px 9px;cursor:pointer;white-space:nowrap;font-size:12.5px}
.chip.on{border-color:transparent;color:#fff;background:var(--ink)}
.chip[data-st=open].on{background:var(--pink)} .chip[data-st=partial].on{background:var(--lav)} .chip[data-st=answered].on{background:var(--blue)}
.chip.on{color:var(--bg)} .chip[data-st].on:not([data-st=all]){color:#fff}
.chip .n{opacity:.75;margin-left:3px;font-variant-numeric:tabular-nums}
#q{width:100%;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--panel);outline:none}
#q:focus{border-color:var(--pink)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:2px 10px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--pink);color:var(--pink-ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.main{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.main:hover{background:var(--pink-ink);color:#fff}
#tagsel{border:1px solid var(--line);border-radius:10px;padding:2px 6px;background:var(--panel);font-size:12.5px;max-width:170px}
.tabs{display:flex;gap:4px}
.tab{flex:1;text-align:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:2px 6px;cursor:pointer;font-size:13px;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .n{opacity:.75;margin-left:3px}
.tree{flex:1;overflow-y:auto;padding:6px 4px 60px}
.node{display:flex;align-items:center;gap:3px;border-radius:8px;padding:2px 6px 2px 0;cursor:pointer;user-select:none;min-width:0}
.node:hover{background:var(--hover)}
.node.sel{background:var(--sel)}
.node.flash{outline:2px solid var(--pink)}
.tw{flex:none;width:16px;text-align:center;color:var(--muted);font-size:11px;cursor:pointer}
.tw:hover{color:var(--pink-ink)}
.sd{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.nid{flex:none;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;width:38px;text-align:right;margin-right:3px}
.nt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.lv0>.node .nt{font-weight:650}
.cnt{flex:none;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.node.dim .nt{color:var(--muted)}
.node.struck .nt{text-decoration:line-through;color:var(--muted)}
.node.drop-in{outline:2px dashed var(--pink)}
.node.drop-before{box-shadow:0 -3px 0 var(--blue) inset}
.node.dragging{opacity:.4}
.grp{font-size:11.5px;color:var(--muted);margin:10px 8px 3px;letter-spacing:.5px;text-transform:uppercase}
#topzone{display:none;margin:6px;border:2px dashed var(--blue);border-radius:10px;padding:6px;text-align:center;color:var(--blue-ink);background:var(--blue-soft);font-size:12.5px}
body.dragmode #topzone{display:block}
.rfoot{border-top:1px solid var(--line);padding:6px 12px;font-size:11.5px;color:var(--muted)}
/* status colours: --c line, --cs soft fill, --ci ink */
[data-st=open]{--c:var(--pink);--cs:var(--pink-soft);--ci:var(--pink-ink)}
[data-st=partial]{--c:var(--lav);--cs:var(--lav-soft);--ci:var(--lav-ink)}
[data-st=answered]{--c:var(--blue);--cs:var(--blue-soft);--ci:var(--blue-ink)}
[data-st=pending]{--c:var(--amber);--cs:var(--amber-soft);--ci:var(--amber-ink)}
[data-st=running]{--c:var(--lav);--cs:var(--lav-soft);--ci:var(--lav-ink)}
[data-st=done]{--c:var(--blue);--cs:var(--blue-soft);--ci:var(--blue-ink)}
[data-st=rejected]{--c:var(--muted);--cs:var(--line);--ci:var(--muted)}
[data-st=current]{--c:var(--blue);--cs:var(--blue-soft);--ci:var(--blue-ink)}
[data-st=retracted]{--c:var(--red);--cs:var(--red-soft);--ci:var(--red-ink)}
.pri{flex:none;font-size:10.5px;font-weight:700;border-radius:5px;padding:0 4px;line-height:15px;font-variant-numeric:tabular-nums}
.pri.P0{background:var(--red);color:#fff} .pri.P1{background:var(--lav-soft);color:var(--lav-ink)} .pri.P2{background:var(--line);color:var(--muted)}
/* pane */
.pane{min-width:0;padding:22px 30px 90px;max-width:1080px}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumb a{color:var(--muted);text-decoration:none;cursor:pointer}
.crumb a:hover{color:var(--pink-ink);text-decoration:underline}
.ph{display:flex;gap:10px;align-items:flex-start;border-top:5px solid var(--c);padding-top:12px;flex-wrap:wrap}
.ph h2{flex:1;margin:0;font-size:21px;line-height:1.45;word-break:break-word;min-width:200px}
.ph h2 .id{font-size:13px;color:var(--muted);font-weight:400;margin-left:8px}
.ph.struck h2{text-decoration:line-through;text-decoration-color:var(--red)}
.pill{flex:none;font-size:12px;border-radius:999px;padding:2px 10px;background:var(--cs);color:var(--ci);margin-top:5px;user-select:none}
.pill.click{cursor:pointer}
.pill.plain{background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.acts{display:flex;gap:6px;flex:none;margin-top:3px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px;font-size:12px;color:var(--muted);align-items:center}
.tag{font-size:12px;border-radius:999px;padding:0 9px;background:var(--blue-soft);color:var(--blue-ink)}
.lk{font-size:12.5px;border-radius:999px;padding:1px 10px;background:var(--pink-soft);color:var(--pink-ink);text-decoration:none;white-space:nowrap;display:inline-block;margin:2px 4px 2px 0;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.lk:hover{background:var(--pink);color:#fff}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 16px;margin-top:14px}
.box>h3{font-size:12px;color:var(--muted);letter-spacing:.5px;font-weight:600;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;text-transform:uppercase}
.atitle{font-weight:650;color:var(--ci);font-size:15px;margin-bottom:4px}
.bd{font-size:14px;word-break:break-word}
.bd ul{margin:2px 0;padding-left:20px}
.bd li{margin:2px 0}
.bd p{margin:4px 0}
.bd .todo{background:var(--pink-soft);border-radius:8px;padding:3px 8px;color:var(--pink-ink)}
.ref{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--lav-soft);color:var(--lav-ink);border-radius:6px;padding:0 4px;cursor:pointer;white-space:nowrap}
.ref.K{background:var(--blue-soft);color:var(--blue-ink)}
.ref.bad{background:var(--red-soft);color:var(--red-ink);text-decoration:line-through}
.ref.missing{background:none;color:var(--muted);cursor:default;text-decoration:underline dotted}
mark{background:#ffe08a;color:#2b2a38;border-radius:3px;padding:0 1px}
.row{display:grid;grid-template-columns:auto 52px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:6px;border-radius:9px;cursor:pointer;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row:hover{background:var(--hover)}
.row .sd{align-self:center}
.row .rid{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .rt{font-weight:600;min-width:0}
.row .ra{font-size:12.5px;color:var(--muted);grid-column:3/5}
.row .rc{font-size:11.5px;color:var(--muted);white-space:nowrap}
.bar{display:inline-flex;height:6px;border-radius:99px;overflow:hidden;width:110px;background:var(--line);vertical-align:middle}
.bar i{display:block}
.tl{list-style:none;margin:0 0 0 6px;padding:0;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 12px 14px}
.tl li:before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--lav)}
.tl .tm{font-size:11.5px;color:var(--muted)}
.tl .tx{white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.pager{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:6px;font-size:12.5px;color:var(--muted)}
.addlog{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.addlog textarea,.addlog input{border:1px solid var(--line);border-radius:10px;padding:6px 10px;outline:none;background:var(--panel)}
.addlog textarea:focus,.addlog input:focus{border-color:var(--pink)}
.addlog .r{display:flex;gap:6px;flex-wrap:wrap}
.addlog .r input{flex:1;min-width:120px}
.hint{font-size:12px;color:var(--muted)}
.home h2{margin:0 0 4px;font-size:20px}
.stat{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.stat b{font-size:18px;color:var(--ink);margin-right:3px}
.empty{color:var(--muted);text-align:center;padding:60px 0}
.note{background:var(--cs);color:var(--ci);border-radius:10px;padding:8px 12px;margin-top:12px;font-size:13.5px}
.note pre{white-space:pre-wrap;font-size:12px;margin:6px 0 0;word-break:break-word}
.note code{background:var(--panel);border-radius:6px;padding:1px 6px;word-break:break-all}
.issue{font-size:13px;padding:3px 0;border-bottom:1px solid var(--line)}
.issue:last-child{border-bottom:none}
/* drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(60,30,70,.12);transform:translateX(105%);transition:transform .2s;z-index:50;display:flex;flex-direction:column}
#drawer.on{transform:none}
#drawer .dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
#drawer .dh b{flex:1;font-size:15px}
#drawer form{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
#drawer label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
#drawer input,#drawer select,#drawer textarea{border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--panel);outline:none}
#drawer input:focus,#drawer textarea:focus,#drawer select:focus{border-color:var(--pink)}
#drawer textarea{resize:vertical;min-height:80px;line-height:1.5}
#drawer .df{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
#drawer .df .sp{flex:1}
.del.arm{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
#tip{position:fixed;z-index:80;max-width:min(480px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px 11px;font-size:12.5px;display:none;pointer-events:none}
#tip .tm{color:var(--muted);font-size:11.5px;margin-bottom:3px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 16px;font-size:13px;display:none;z-index:90;max-width:90vw}
.mtoggle{display:none;position:fixed;left:14px;bottom:14px;z-index:70;border:none;border-radius:999px;padding:8px 14px;background:var(--pink);color:#fff;box-shadow:var(--shadow);cursor:pointer}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:min(92vw,380px);transform:translateX(-102%);transition:transform .18s;z-index:60}
  .rail.open{transform:none}
  .mtoggle{display:inline-flex}
  .pane{padding:16px 16px 90px}
  .row{grid-template-columns:auto 44px minmax(0,1fr)}
  .row .rc{display:none}
}
</style>
</head>
<body>
<div class="shell">
<nav class="rail" id="rail">
  <div class="rhead">
    <div class="rrow">
      <h1 id="home" data-i="home_title_html"></h1>
      <button class="btn" id="lang" title="English / 中文"></button>
      <button class="btn" id="undo" data-it="undo_tip" data-i="undo"></button>
      <button class="btn main" id="new" data-it="new_tip">＋</button>
    </div>
    <div class="tabs">
      <span class="tab on" data-mode="T"><span data-i="tab_T"></span><span class="n" id="n_T"></span></span>
      <span class="tab" data-mode="P"><span data-i="tab_P"></span><span class="n" id="n_P"></span></span>
      <span class="tab" data-mode="K"><span data-i="tab_K"></span><span class="n" id="n_K"></span></span>
      <span class="tab" data-mode="S"><span data-i="tab_S"></span><span class="n" id="n_S"></span></span>
    </div>
    <div class="rrow" id="stchips"></div>
    <div class="rrow" id="prchips"></div>
    <input id="q" autocomplete="off">
    <div class="rrow">
      <select id="tagsel"></select>
      <span style="flex:1"></span>
      <button class="btn" id="exp1" data-i="expand1"></button>
      <button class="btn" id="expall" data-i="expand_all"></button>
    </div>
  </div>
  <div id="topzone" data-i="drop_top"></div>
  <div class="tree" id="tree"></div>
  <div class="rfoot" id="rfoot"></div>
</nav>
<main class="pane" id="pane"></main>
</div>
<button class="mtoggle" id="mtoggle">☰</button>

<aside id="drawer" aria-hidden="true">
  <div class="dh"><b id="dtitle"></b><span class="hint" data-i="drawer_keys"></span></div>
  <form id="f" onsubmit="return false"></form>
  <div class="df"><button class="btn del" id="fdel"></button><span class="sp"></span><button class="btn" id="fcancel" data-i="cancel"></button><button class="btn main" id="fsave" data-i="save"></button></div>
</aside>
<div id="tip"></div>
<div id="toast"></div>

<script>
"use strict";
// ───────────────────────── i18n

const store = (()=>{ try{ const s=window.localStorage; s.setItem("_t","1"); s.removeItem("_t"); return s; }catch(e){ return null; } })();

function lsSet(k,v){ try{ store&&store.setItem(k,JSON.stringify(v)); }catch(e){} }

const STS = {T:["open","partial","answered"], P:["pending","running","done","rejected"], K:["current","retracted"]};

async function api(path, body){
  const r = await fetch(path, body===undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json","X-Desk-Client":"1"}, body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || ("HTTP "+r.status));
  return j;
}
function toast(m){ const el=$("#toast"); el.textContent=m; el.style.display="block"; clearTimeout(toast.h); toast.h=setTimeout(()=>el.style.display="none",2200); }

async function reload(){
  const [d, iss, h] = await Promise.all([api("/api/state"), api("/api/check"), api("/api/health")]);
  DB = d; ISSUES = iss; ALLOW_RUN = !!h.allow_run;
  byId = {}; kids = {};
  for(const c of ["tickets","proposals","knowledge"]) for(const x of DB[c]) byId[x.id]=x;
  for(const x of DB.tickets){ const p = (x.parent && byId[x.parent]) ? x.parent : ""; (kids[p] ||= []).push(x); }
  for(const k in kids) kids[k].sort((a,b)=>a.order-b.order);
  if(EXP===null){ EXP={}; for(const x of kids[""]||[]) EXP[x.id]=true; }
  if(VIEW && !byId[VIEW]){ VIEW=null; history.replaceState(null,"",location.pathname+location.search); }
  renderAll();
}

// ───────────────────────── text rendering
function hl(s){
  if(!F.q) return s;
  const re = new RegExp("("+F.q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  return s.replace(/(<[^>]+>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.replace(re,"<mark>$1</mark>"));
}
function refHtml(id){
  const x = byId[id];
  if(!x) return `<span class="ref missing" title="${esc(t("missing_ref"))}">${id}</span>`;
  const bad = x.id[0]==="K" && x.status==="retracted";
  return `<span class="ref ${x.id[0]}${bad?" bad":""}" data-go="${id}" data-ref="${id}">${id}</span>`;
}
function inline(s){ return esc(s).replace(/\b[TPK]\d{3,}\b/g, refHtml); }
function body(txt){
  const lines = String(txt||"").split(/\n/); let h="", inUl=false;
  for(const l of lines){
    const s = l.trim();
    if(!s){ if(inUl){h+="</ul>";inUl=false;} continue; }
    if(/^[-•*]\s+/.test(s)){ if(!inUl){h+="<ul>";inUl=true;} h+="<li>"+inline(s.replace(/^[-•*]\s+/,""))+"</li>"; continue; }
    if(inUl){h+="</ul>";inUl=false;}
    h += /^(TODO|待查|待决)/i.test(s) ? `<p class="todo">${inline(s)}</p>` : `<p>${inline(s)}</p>`;
  }
  if(inUl) h+="</ul>";
  return hl(h);
}
const plain = s=>String(s||"").replace(/\s+/g," ").trim();
const short = (s,n)=>{ s=String(s||""); return s.length>n ? s.slice(0,n)+"…" : s; };

// ───────────────────────── filtering
function hay(x){ return [x.id,x.title,x.question,x.answer_title,x.answer,x.summary,x.body,x.source,x.approve_cmd,(x.tags||[]).join(" "),(x.tickets||[]).join(" "),
  (x.log||[]).map(e=>e.text+" "+(e.name||"")).join(" ")].join(" ").toLowerCase(); }
function selfMatch(x){
  if(F.st!=="all" && x.status!==F.st) return false;
  if(F.tag && !(x.tags||[]).includes(F.tag)) return false;
  if(F.pr && x.id[0]!=="K" && (F.pr==="-" ? !!x.priority : x.priority!==F.pr)) return false;
  if(F.q && !hay(x).includes(F.q.toLowerCase())) return false;
  return true;
}
const filtering = ()=> F.st!=="all" || F.q || F.tag || F.pr;
let VIS = {};
function computeVis(){
  VIS = {};
  (function go(p){ let any=false; for(const x of kids[p]||[]){ const sub=go(x.id); const v=selfMatch(x)||sub; VIS[x.id]=v; any=any||v; } return any; })("");
}
function descendants(x){ const out=[]; (function go(y){ for(const c of kids[y.id]||[]){ out.push(c); go(c); } })(x); return out; }
function ancestorsOf(id){ const a=[]; let p=byId[id]?.parent; while(p && byId[p] && !a.includes(p)){ a.unshift(p); p=byId[p].parent; } return a; }

  for(const k of "TPK") $("#n_"+k).textContent = k==="P" ? (()=>{ const n=items("P").filter(x=>x.status==="pending").length; return n? n+"/"+items("P").length : items("P").length; })() : items(k).length;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on", x.dataset.mode===MODE));

function flatNode(x, extra){
  return `<div class="node${x.id===VIEW?" sel":""}${x.status==="retracted"?" struck":""}" data-id="${x.id}" data-st="${x.status}" style="padding-left:6px" title="${esc(x.id+" "+x.title)}">`+
    `<span class="sd"></span>${priB(x.priority)}<span class="nid">${x.id}</span><span class="nt">${hl(esc(x.title))}</span>${extra?`<span class="cnt">${esc(extra)}</span>`:""}</div>`;
}
function renderFlat(){
  const L = items(MODE).filter(selfMatch); let h="";
  for(const s of STS[MODE]){
    const xs = L.filter(x=>x.status===s).sort((a,b)=>String(b.updated).localeCompare(String(a.updated)));
    if(xs.length) h += `<div class="grp">${t("st_"+s)} · ${xs.length}</div>` + xs.map(x=>flatNode(x, MODE==="P" ? (x.tickets||[]).join(" ") : (x.superseded_by ? "→ "+x.superseded_by : ""))).join("");
  }
  $("#tree").innerHTML = h || `<div class="empty" style="padding:30px 0">${t(items(MODE).length ? "nothing" : MODE==="P" ? "no_props" : "no_k")}</div>`;
}
function renderTree(){
  if(MODE!=="T") return renderFlat();
  computeVis();
  const out=[];
  (function go(p, dep){
    for(const x of kids[p]||[]){
      if(!VIS[x.id]) continue;
      const ks=(kids[x.id]||[]).filter(c=>VIS[c.id]);
      const open = filtering() ? true : !!EXP[x.id];
      const nd = descendants(x).length, dim = filtering() && !selfMatch(x);
      out.push(`<div class="lv${Math.min(dep,2)}"><div class="node${x.id===VIEW?" sel":""}${dim?" dim":""}" data-id="${x.id}" data-st="${x.status}" draggable="true" style="padding-left:${4+dep*14}px" title="${esc(x.id+" "+x.title)}">`+
        `<span class="tw" data-tw="1">${ks.length?(open?"▾":"▸"):""}</span><span class="sd"></span>${priB(x.priority)}<span class="nid">${x.id}</span>`+
        `<span class="nt">${hl(esc(x.title))}</span>${nd?`<span class="cnt">${nd}</span>`:""}</div></div>`);
      if(ks.length && open) go(x.id, dep+1);
    }
  })("",0);
  $("#tree").innerHTML = out.length ? out.join("") : `<div class="empty" style="padding:30px 0">${t("nothing")}</div>`;
}

function statBar(list){

  const n=list.length||1, col={open:"pink",partial:"lav",answered:"blue"};

}
function rows(list){

    if(x.id[0]==="T"){ const ds=descendants(x); if(ds.length) right=`${ds.length} ${statBar(ds).bar}`; sub=x.answer_title; }
    else if(x.id[0]==="P"){ right=esc(t("st_"+x.status)); sub=x.summary; }
    else { right=x.status==="retracted"?esc(t("st_retracted")):""; sub=plain(x.body).slice(0,140); }
    return `<div class="row" data-go="${x.id}" data-st="${x.status}"><span class="sd"></span><span class="rid">${priB(x.priority)} ${x.id}</span><span class="rt">${hl(esc(x.title))}</span>`+
      `<span class="rc">${right}</span>${sub?`<span class="ra">${hl(inline(sub))}</span>`:""}</div>`;
  }).join("");
}

function renderProposal(x){
  const ex=x.exec||null, cmd=String(x.approve_cmd||"");
  const tks=(x.tickets||[]).map(refHtml).join(" ");
  const exBox = !ex ? "" : ex.state==="running" ? `<div class="note" data-st="running"><b>${t("ex_running")}</b> ${dt(ex.started)}　<code>${esc(ex.cmd||"")}</code></div>`
    : ex.state==="ok" ? `<div class="note" data-st="done"><b>${t("ex_ok")}</b> (rc 0, ${dt(ex.ended)})<pre>${esc(ex.tail||"")}</pre></div>`
    : ex.state==="failed" ? `<div class="note" data-st="retracted"><b>${t("ex_fail")}</b> (rc ${esc(ex.rc)}${ex.error?", "+esc(ex.error):""}, ${dt(ex.ended)}) ${t("ex_fail_hint")}<pre>${esc(ex.tail||"")}</pre><div class="hint">${t("full_log")}: ${esc(ex.log||"")}</div></div>`
    : `<div class="note" data-st="running">${esc(ex.note||"")}</div>`;
  const runnable = ALLOW_RUN && /\.(py|sh|cmd|bat|ps1)\s*["']?$/i.test(cmd);
  const how = x.status==="pending" ? `<div class="note" data-st="pending">${runnable?t("p_pending_script",esc(cmd)):(ALLOW_RUN||!cmd?t("p_pending_agent",esc(cmd)||"—"):t("p_pending_norun"))}`+
      `<div style="margin-top:8px"><button class="btn main" id="p_run" data-id="${x.id}">${runnable?t("approve_run"):t("approve")}</button>　<button class="btn" id="p_rej" data-id="${x.id}">${t("reject")}</button></div></div>`
    : x.status==="running" ? `<div class="note" data-st="running">${t("p_running",dt(x.approved_at),x.approved_by?" ("+esc(x.approved_by)+")":"")}${cmd?`<br><code>${esc(cmd)}</code>`:""}<div style="margin-top:8px"><button class="btn" id="p_rej" data-id="${x.id}">${t("reject")}</button></div></div>`
    : x.status==="done" ? `<div class="note" data-st="done"><b>${t("p_done")}</b> ${(x.archived_to||[]).map(refHtml).join(" ")}　${dt(x.done_at)}<div class="bd" style="margin-top:4px">${body(x.result||"")}</div></div>`
    : `<div class="note" data-st="rejected">${t("p_rejected")}</div>`;
  $("#pane").innerHTML = crumb(t("tab_P"))+
    `<div class="ph" data-st="${x.status}"><span class="pill">${t("st_"+x.status)}</span>${x.priority?`<span class="pill plain">${x.priority}</span>`:""}<h2>${hl(esc(x.title))}<span class="id">${x.id}</span></h2><div class="acts"><button class="btn" data-act="edit">${t("edit")}</button></div></div>`+

    (x.summary?`<div class="box" data-st="${x.status}"><h3>${t("summary")}</h3><div class="atitle">${hl(inline(x.summary))}</div></div>`:"")+
    (plain(x.body)?`<div class="box"><h3>${t("body")}</h3><div class="bd">${body(x.body)}</div></div>`:"")+
    `<div class="box"><h3>${t("log",(x.log||[]).length)}</h3>${timeline(x.log,LOGPAGE)}${addLogBox(x.id)}</div>`;
}

let ED = null, delArm = 0;
function parentOptions(selfId, cur){
  const bad=new Set(); if(selfId){ bad.add(selfId); for(const d of descendants(byId[selfId])) bad.add(d.id); }
  let o=`<option value="">${esc(t("top_level"))}</option>`;
  (function walk(p,dep){ for(const x of kids[p]||[]){ if(bad.has(x.id)) continue; o+=`<option value="${x.id}"${x.id===cur?" selected":""}>${"　".repeat(dep)}${esc(x.id)} ${esc(short(x.title,60))}</option>`; walk(x.id,dep+1); } })("",0);
  return o;
}
const priSel = v => `<label>${t("f_priority")}<select name="priority">${PRIS.map(p=>`<option value="${p}"${(v||"")===p?" selected":""}>${esc(t(p?"pri_"+p:"pri_none"))}</option>`).join("")}</select></label>`;
const inp = (n,lab,v,ph)=>`<label>${lab}<input name="${n}" value="${esc(v||"")}" placeholder="${esc(ph||"")}"></label>`;
const ta = (n,lab,v,rows,ph)=>`<label>${lab}<textarea name="${n}" rows="${rows}" placeholder="${esc(ph||"")}">${esc(v||"")}</textarea></label>`;
const linksText = x => (x?.links||[]).map(l=>l.label===l.url?l.url:l.label+"|"+l.url).join("\n");
function openDrawer(kind, x, parent){

  $("#dtitle").textContent = x ? t("edit_x",x.id) : (kind==="T" ? (parent?t("new_child",parent):t("new_T")) : t("new_"+kind));

    priSel(x?.priority)+`<label>${t("f_parent")}<select name="parent">${parentOptions(x?.id, x?(x.parent||""):(parent||""))}</select></label>`+
    ta("question",t("f_question"),x?.question,4,t("f_question_ph"))+inp("answer_title",t("f_answer_title"),x?.answer_title,t("f_answer_title_ph"))+
    ta("answer",t("f_answer"),x?.answer,8,t("f_answer_ph"))+ta("links",t("f_links"),linksText(x),2,"label|https://…")+
    inp("tags",t("f_tags"),(x?.tags||(parent?byId[parent].tags:[])||[]).join(", "))+inp("source",t("f_source"),x?.source);
  else if(kind==="K") f.innerHTML = inp("title",t("f_k_title"),x?.title)+ta("body",t("f_k_body"),x?.body,8)+
    ta("links",t("f_links"),linksText(x),2,"label|https://…")+inp("tags",t("f_tags"),(x?.tags||[]).join(", "))+inp("source",t("f_source"),x?.source);
  else f.innerHTML = inp("title",t("f_title"),x?.title)+priSel(x?.priority)+inp("summary",t("f_summary"),x?.summary)+ta("body",t("f_body"),x?.body,8)+

  $("#drawer").classList.add("on"); $("#drawer").setAttribute("aria-hidden","false");
  setTimeout(()=>f.title.focus(),50);

let DRAG=null;
const clearDrop=()=>document.querySelectorAll(".drop-in,.drop-before").forEach(x=>x.classList.remove("drop-in","drop-before"));

  const n=e.target.closest(".node"); if(!n||MODE!=="T") return;
  DRAG=n.dataset.id; n.classList.add("dragging"); document.body.classList.add("dragmode");
  e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",DRAG);

function dropTarget(e){
  const n=e.target.closest(".node"); if(!n||!DRAG) return null;
  const id=n.dataset.id; if(id===DRAG || descendants(byId[DRAG]).some(d=>d.id===id)) return null;
  const r=n.getBoundingClientRect(); return {n, id, before:(e.clientY-r.top) < r.height*0.3};
}

  const d=dropTarget(e); clearDrop(); if(!d) return; e.preventDefault();
  const b=d.before ? {parent:byId[d.id].parent||null, before:d.id} : {parent:d.id};
  try{ await api(`/api/tickets/${DRAG}/move`,b); toast(d.before?t("moved_before",DRAG,d.id):t("moved_in",DRAG,d.id)); if(!d.before){ EXP[d.id]=true; lsSet("td_tree_exp",EXP); } reload(); }catch(err){ toast(err.message); }

  if(!r){ tip.style.display="none"; return; }
  const x=byId[r.dataset.ref]; if(!x) return;
  const st = x.status==="retracted" ? `<b style="color:var(--red-ink)">${t("k_retracted_tip")}</b>${x.superseded_by?" → "+esc(x.superseded_by):""} · ` : esc(t("st_"+x.status))+" · ";
  const more = x.id[0]==="T" ? (x.answer_title||"") : x.id[0]==="P" ? (x.summary||"") : short(plain(x.body),220);
  tip.innerHTML=`<div class="tm">${x.id} · ${st}${dt(x.updated)}</div><div style="font-weight:600">${esc(x.title)}</div>${more?`<div>${esc(more)}</div>`:""}`;
  const b=r.getBoundingClientRect();
  tip.style.left=Math.max(8,Math.min(b.left, innerWidth-Math.min(480,innerWidth*0.92)-8))+"px";
  tip.style.top=(b.bottom+150>innerHeight ? Math.max(8,b.top-130) : b.bottom+6)+"px";
  tip.style.display="block";
});

const fromHash=()=>{ const m=/^#([TPK]\d+)$/.exec(location.hash); go(m?m[1]:null,{fromHash:true}); };
window.addEventListener("popstate", fromHash);
window.addEventListener("hashchange", fromHash);
applyI18n();
reload().then(fromHash).catch(err=>{ $("#pane").innerHTML=`<div class="empty">${esc(t("load_fail",err.message))}</div>`; });
</script>
<script src="/sessions.js"></script>
</body>
